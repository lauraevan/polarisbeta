<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Education Cat Learning and Tutoring</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    body {
      position: fixed;
      inset: 0;
    }
    #appFrame {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      border: 0;
      margin: 0;
      padding: 0;
      background: #000;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      font-size: 16px;
    }
    #fsbtn {
      position: fixed;
      z-index: 2;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 6px;
      background: rgba(0,0,0,.68);
      color: #fff;
      cursor: pointer;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }
    #fsbtn:hover { background: rgba(255,255,255,.16); }
    #fsbtn.hidden { display: none; }
    @media (max-width: 767px) {
      #fsbtn { top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); font-size: 12px; padding: 7px 10px; }
    }
    @media (min-width: 768px) and (max-width: 1366px) {
      #fsbtn { top: 12px; right: 12px; font-size: 14px; padding: 9px 14px; }
    }
    @media (min-width: 1367px) {
      #fsbtn { top: 16px; right: 16px; font-size: 15px; padding: 10px 16px; }
    }
  </style>
</head>
<body>
  <div id="loading">Loading…</div>
  <button id="fsbtn" type="button" aria-label="Open fullscreen">⛶ Fullscreen</button>
  <iframe
    id="appFrame"
    src="https://educationcatlearningandtutoring.com"
    allow="fullscreen; autoplay; clipboard-read; clipboard-write"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
  <script>
    const frame = document.getElementById('appFrame');
    const loading = document.getElementById('loading');
    const btn = document.getElementById('fsbtn');

    function sizeToViewport() {
      const width = `${window.innerWidth}px`;
      const height = `${window.innerHeight}px`;
      document.documentElement.style.width = width;
      document.documentElement.style.height = height;
      document.body.style.width = width;
      document.body.style.height = height;
      frame.style.width = width;
      frame.style.height = height;
    }

    async function goFullscreen() {
      const target = document.documentElement;
      const request = target.requestFullscreen || target.webkitRequestFullscreen || target.msRequestFullscreen;
      if (request) {
        try { await request.call(target); } catch (error) {}
      }
      sizeToViewport();
      if (document.fullscreenElement || document.webkitFullscreenElement) btn.classList.add('hidden');
    }

    sizeToViewport();
    window.addEventListener('resize', sizeToViewport, { passive: true });
    window.addEventListener('orientationchange', () => setTimeout(sizeToViewport, 250), { passive: true });
    frame.addEventListener('load', () => { loading.style.display = 'none'; sizeToViewport(); });
    btn.addEventListener('click', goFullscreen);
    document.addEventListener('fullscreenchange', () => btn.classList.toggle('hidden', Boolean(document.fullscreenElement)));
    document.addEventListener('webkitfullscreenchange', () => btn.classList.toggle('hidden', Boolean(document.webkitFullscreenElement)));
  </script>
</body>
</html>
