<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Education Cat Learning and Tutoring</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    body {
      position: fixed;
      inset: 0;
    }
    #appFrame {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      border: 0;
      margin: 0;
      padding: 0;
      background: #000;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading…</div>
  <iframe
    id="appFrame"
    src="https://educationcatlearningandtutoring.com"
    allow="autoplay; clipboard-read; clipboard-write; storage-access *"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
  <script>
    const frame = document.getElementById('appFrame');
    const loading = document.getElementById('loading');

    function sizeToViewport() {
      const width = `${window.innerWidth}px`;
      const height = `${window.innerHeight}px`;
      document.documentElement.style.width = width;
      document.documentElement.style.height = height;
      document.body.style.width = width;
      document.body.style.height = height;
      frame.style.width = width;
      frame.style.height = height;
    }

    sizeToViewport();
    window.addEventListener('resize', sizeToViewport, { passive: true });
    window.addEventListener('orientationchange', () => setTimeout(sizeToViewport, 250), { passive: true });
    frame.addEventListener('load', () => { loading.style.display = 'none'; sizeToViewport(); });
  </script>
</body>
</html>
