<svg xmlns="http://www.w3.org/2000/svg" width="100vw" height="100vh" viewBox="0 0 100 100" preserveAspectRatio="none" style="display:block;position:fixed;inset:0;margin:0;padding:0;width:100vw;height:100vh;background:#000;">
  <foreignObject x="0" y="0" width="100" height="100" requiredExtensions="http://www.w3.org/1999/xhtml">
    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <title>Loading…</title>
        <style><![CDATA[
          *, *::before, *::after { box-sizing: border-box; }

          html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            min-width: 100vw;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
          }

          iframe {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            min-width: 100vw;
            min-height: 100vh;
            min-height: 100dvh;
            border: 0;
            margin: 0;
            padding: 0;
            display: block;
            background: #000;
          }

          #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            background: #000;
            font-size: 16px;
          }
        ]]></style>
        <script><![CDATA[
          if (!location.hash) {
            history.replaceState(history.state, "", "#/" );
          }
          function syncViewport() {
            document.documentElement.style.width = window.innerWidth + 'px';
            document.documentElement.style.height = window.innerHeight + 'px';
            document.body.style.width = window.innerWidth + 'px';
            document.body.style.height = window.innerHeight + 'px';
          }
          syncViewport();
          window.addEventListener('resize', syncViewport);
          window.addEventListener('orientationchange', syncViewport);
        ]]></script>
      </head>
      <body>
        <div id="loading">Loading…</div>
        <iframe
          src="https://educationcatlearningandtutoring.com"
          allow="fullscreen; autoplay; clipboard-read; clipboard-write; storage-access *"
          allowfullscreen="allowfullscreen"
          onload="document.getElementById('loading').style.display='none'"
        ></iframe>
      </body>
    </html>
  </foreignObject>
</svg>